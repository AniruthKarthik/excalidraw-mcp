[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "excalidraw-mcp"
version = "0.1.0"
description = "A local MCP server for creating and editing Excalidraw documents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.3.1,<4",
]

[project.urls]
Repository = "https://github.com/Dharshan2208/excalidraw-mcp"
Issues = "https://github.com/Dharshan2208/excalidraw-mcp/issues"

[project.scripts]
excalidraw-mcp = "excalidraw_mcp.server:run"

[tool.setuptools]
packages = ["excalidraw_mcp"]
